name: Build players

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

# Read-only by default. Only `publish` may write: it attaches the files the
# build jobs made and runs no code from this repository, PyPI or the SDK.
# https://docs.github.com/en/actions/reference/security/secure-use#use-the-principle-of-least-privilege
permissions:
  contents: read

env:
  EM_VERSION: 6.0.9

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Major only: each run takes the newest security release of the LTS.
          node-version: "26"
      - name: Build
        run: |
          emcmake cmake -S hosts/wasm -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j
      - name: Test in Node
        run: node hosts/wasm/test.mjs build-wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chili-beat-web
          path: |
            build-wasm/chili-beat.js
            build-wasm/chili-beat.wasm
            build-wasm/player.js
            build-wasm/index.html
            build-wasm/bee-home.beat
          if-no-files-found: error

  blit:
    name: 32blit ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            cmake-args: ""
            apt-packages: libsdl2-dev libsdl2-image-dev libsdl2-net-dev
          - name: Console
            cmake-args: >-
              -DPICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk -DPICO_BOARD=chilichip_vgc
              -DPICO_PLATFORM=rp2350-arm-s -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/32blit-sdk/pico2.toolchain
              -DBLIT_EXECUTABLE_PICO_BLIT=1
            apt-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: chili-chip/32blit-sdk
          path: 32blit-sdk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.name == 'Console'
        with:
          persist-credentials: false
          repository: chili-chip/pico-sdk
          path: pico-sdk
          submodules: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.name == 'Console'
        with:
          persist-credentials: false
          repository: chili-chip/pico-extras
          path: pico-extras
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ${{ matrix.apt-packages }} pipx
          pipx install 32blit
          pipx inject --force 32blit "bitstring<5"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          cmake -S main/hosts/32blit -B build -DCMAKE_BUILD_TYPE=Release -D32BLIT_DIR=$GITHUB_WORKSPACE/32blit-sdk ${{ matrix.cmake-args }}
          cmake --build build -j 4
      - name: Check the .blit is for the console
        if: matrix.name == 'Console'
        run: |
          python3 - build/*.blit <<'PY'
          import struct, sys
          # BlitGameHeader: magic, render, tick, init, end, then the uint16 device id
          for path in sys.argv[1:]:
              magic, device_id = struct.unpack_from('<4s16xH', open(path, 'rb').read())
              if magic != b'BLIT' or device_id != 3:
                  sys.exit(f'{path}: not an RP2350 .blit (magic {magic}, device {device_id})')
              print(f'{path}: RP2350 .blit')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.name == 'Console'
        with:
          name: chili-beat-blit
          path: build/*.blit
          if-no-files-found: error

  # The only job that may write: it attaches the release files the build jobs
  # made. It runs even when one build failed, so the other files still go up.
  publish:
    if: ${{ !cancelled() && github.event_name == 'release' }}
    needs: [wasm, blit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chili-beat-*
          path: release
          merge-multiple: true
      - name: Attach to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          fail_on_unmatched_files: false
          files: |
            release/chili-beat.js
            release/chili-beat.wasm
            release/player.js
            release/*.blit
