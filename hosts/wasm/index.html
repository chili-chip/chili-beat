<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chili Beat player</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 12px;
           background: #1a1c2c; color: #f4f4f4; font: 15px system-ui, sans-serif; }
    canvas { width: min(90vmin, 512px); height: min(90vmin, 512px); image-rendering: pixelated; }
    p { margin: 0; text-align: center; }
    pre { color: #ef7d57; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <canvas id="screen"></canvas>
    <p>Arrows or WASD to move, Z or Space for A, X for B.</p>
    <p><label>Play your own game: <input type="file" id="file" accept=".beat"></label></p>
    <pre id="error"></pre>
  </main>
  <script type="module">
    import createChiliBeat from "./chili-beat.js";
    import { ChiliBeatPlayer } from "./player.js";

    const player = await ChiliBeatPlayer.create(createChiliBeat);
    const canvas = document.getElementById("screen");
    const errorBox = document.getElementById("error");

    function play(text) {
      const error = player.load(text);
      errorBox.textContent = error || "";
      if (!error) player.start(canvas);
    }

    play(await (await fetch("bee-home.beat")).text());
    document.getElementById("file").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (file) play(await file.text());
    });
  </script>
</body>
</html>
