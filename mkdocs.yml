site_name: Chili Beat
site_description: A tiny no-code game engine for the web and the chilichip console
site_url: https://chili-chip.github.io/chili-beat/
repo_url: https://github.com/chili-chip/chili-beat
repo_name: chili-chip/chili-beat
edit_uri: edit/main/docs/
copyright: Chili Beat by chilichip. Sweetie 16 palette by GrafxKid.

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Atkinson Hyperlegible
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Make games:
      - Rules: rules.md
      - Palette: palette.md
      - Sound: sound.md
      - Example games: examples.md
  - Reference:
      - File format: format.md
      - How a beat runs: beat.md
      - Engine API: engine.md
      - Web player: web.md
      - Console player: console.md
  - Develop:
      - Building and testing: develop.md
      - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true

plugins:
  - search
